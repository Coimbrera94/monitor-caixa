name: Monitor da Caixa
on:
  schedule:
    # 07:30, 13:30 e 18:30 no Horário de Brasília (10:30, 16:30 e 21:30 em UTC)
    - cron: '30 10,16,21 * * *'
  workflow_dispatch: 

jobs:
  rodar-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar dependências
        run: pip install pandas requests
      - name: Rodar script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python monitor.py
      - name: Salvar nova base de dados
        run: |
          git config --global user.name 'Robo Caixa'
          git config --global user.email 'robo@caixa.com'
          git add .
          git commit -m "Atualizando bases de imoveis" || true
          git push
